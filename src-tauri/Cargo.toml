[package]
name = "jellypilot"
version = "1.5.0"
description = "JellyPilot - A cast receiver for Jellyfin that controls external MPV"
authors = ["Hewel"]
license = "MIT"
repository = "https://github.com/hewel/jellypilot"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "jellypilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
base64 = "0.22.1"
sha2 = "0.10.9"
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2.9.0"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.52.3", features = ["full"] }
thiserror = "2.0.18"
parking_lot = "0.12.5"
async-channel = "2.5.0"
which = "8.0.2"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
futures-util = "0.3.32"
tauri-plugin-store = "2.4.3"
tauri-plugin-shell = "2.3.5"
tokio-util = { version = "0.7.18", features = ["io"] }
reqwest = { version = "0.13.3", features = ["json", "query", "rustls", "stream"] }
axum = "0.8.9"
bytes = "1.11.1"
fs2 = "0.4.3"
hls_m3u8 = "0.5.1"
url = "2.5.8"
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "derive"] }
jellypilot-playback-core = { path = "../crates/jellypilot-playback-core" }
jellypilot-media-server = { path = "../crates/jellypilot-media-server" }
jellypilot-mpv = { path = "../crates/jellypilot-mpv" }
jellypilot-session = { path = "../crates/jellypilot-session" }

[features]
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
jellypilot-mpv = { path = "../crates/jellypilot-mpv", features = ["test-utils"] }

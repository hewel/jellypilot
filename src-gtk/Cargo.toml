[package]
name = "jellypilot-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native GTK 4 frontend for JellyPilot on Linux"

[target.'cfg(target_os = "linux")'.dependencies]
jellypilot-core = { path = "../crates/jellypilot-core" }
jellypilot-media-server = { path = "../crates/jellypilot-media-server" }
jellypilot-mpv = { path = "../crates/jellypilot-mpv" }
keyring = { version = "=3.6.3", default-features = false, features = ["crypto-rust", "sync-secret-service", "vendored"] }
relm4 = { version = "0.9.1", default-features = false, features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zeroize = "1.8.1"

[lints]
workspace = true

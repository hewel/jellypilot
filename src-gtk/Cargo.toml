[package]
name = "jellypilot-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native GTK 4 frontend for JellyPilot on Linux"

[target.'cfg(target_os = "linux")'.dependencies]
jellypilot-auth = { path = "../crates/jellypilot-auth" }
jellypilot-core = { path = "../crates/jellypilot-core" }
jellypilot-media-server = { path = "../crates/jellypilot-media-server" }
jellypilot-mpv = { path = "../crates/jellypilot-mpv" }
jellypilot-session = { path = "../crates/jellypilot-session" }
relm4 = { version = "0.9.1", default-features = false, features = ["macros", "libadwaita", "gnome_46"] }
serde_json = "1.0.149"

[dev-dependencies]
jellypilot-mpv = { path = "../crates/jellypilot-mpv", features = ["test-utils"] }

[lints]
workspace = true

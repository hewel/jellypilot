# Windows SDR baseline: D3D11VA hardware decoding with frames copied through
# system memory into Vulkan. Unsupported codecs/devices fall back to software.
# Color settings follow the pinned fork's TOOLS/gpu-next-host-baseline.conf.
# Load explicitly with --no-config --include=<absolute path to this file>.
vo=gpu-next
gpu-api=vulkan
hwdec=d3d11va-copy
profile=gpu-hq
target-colorspace-hint=yes
tone-mapping=bt.2446a
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.3
hdr-compute-peak=auto
dither-depth=auto
dither=fruit
target-trc=auto
target-prim=auto
target-peak=auto
target-contrast=auto
hdr-reference-white=auto
gamut-mapping-mode=auto
video-sync=audio
interpolation=no
# Remove non-video overlays equally on both comparison paths, not color effects.
load-scripts=no
osc=no
osd-level=0
sid=no
save-position-on-quit=no

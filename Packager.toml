name = "jellypilot"
product-name = "JellyPilot"
version = "2.2.3"
identifier = "top.pigfun.jellypilot"
publisher = "hewel"
authors = ["hewel"]
license-file = "LICENSE"
homepage = "https://github.com/hewel/jellypilot"
description = "Jellyfin and Emby companion app with embedded MPV from the pinned mpv fork"
category = "Video"
binaries-dir = "target/release"
out-dir = "target/release/bundle"
before-packaging-command = "cargo xtask iced build --release"
binaries = [
  { path = "jellypilot", main = true },
  { path = "jellypilot-diagnostics", main = false },
]
icons = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/128x128@2x.png",
  "assets/icons/icon.ico",
  "assets/icons/icon.icns",
]

[nsis]
# Windows releases use `cargo xtask package windows --runtime-dir <UCRT64/bin>`.
# It adds verified embedded resources to this shared config before invoking NSIS.
installMode = "currentUser"

[deb]
package-name = "jellypilot"
section = "video"
priority = "optional"
depends = [
  "libgtk-3-0",
  "libxkbcommon0",
  "libwayland-client0",
  "libavcodec62",
  "libavfilter11",
  "libavformat62",
  "libavutil60",
  "libswresample6",
  "libswscale9",
  "libass9",
  "libluajit-5.1-2",
  "libvulkan1",
]

# `mpv linux-runtime` stages libmpv, private libplacebo and its required closure.
# Directory mappings retain host-specific SONAME filenames and license notices.
[deb.files]
"target/embedded-mpv/lib/jellypilot" = "usr/lib/jellypilot"
"target/embedded-mpv/share/jellypilot/mpv-baseline.conf" = "usr/share/jellypilot/mpv-baseline.conf"
"target/embedded-mpv/manifest.json" = "usr/share/jellypilot/mpv-manifest.json"
"target/embedded-mpv/share/jellypilot/licenses/linux-runtime" = "usr/share/jellypilot/licenses/linux-runtime"

[appimage.files]
"target/embedded-mpv/lib/jellypilot" = "usr/lib/jellypilot"
"target/embedded-mpv/share/jellypilot/mpv-baseline.conf" = "usr/share/jellypilot/mpv-baseline.conf"
"target/embedded-mpv/manifest.json" = "usr/share/jellypilot/mpv-manifest.json"
"target/embedded-mpv/share/jellypilot/licenses/linux-runtime" = "usr/share/jellypilot/licenses/linux-runtime"

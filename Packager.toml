name = "jellypilot"
product-name = "JellyPilot"
version = "2.2.0"
identifier = "top.pigfun.jellypilot"
publisher = "hewel"
authors = ["hewel"]
license-file = "LICENSE"
homepage = "https://github.com/hewel/jellypilot"
description = "Jellyfin and Emby companion app with embedded MPV from the pinned mpv fork"
category = "Video"
binaries-dir = "target/release"
out-dir = "target/release/bundle"
before-packaging-command = "bun run task iced build --release"
binaries = [{ path = "jellypilot", main = true }]
icons = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/128x128@2x.png",
  "assets/icons/icon.ico",
  "assets/icons/icon.icns",
]

[nsis]
installMode = "currentUser"

[deb]
package-name = "jellypilot"
section = "video"
priority = "optional"
depends = [
  "libgtk-3-0",
  "libxkbcommon0",
  "libwayland-client0",
  "libavcodec62",
  "libavfilter11",
  "libavformat62",
  "libavutil60",
  "libswresample6",
  "libswscale9",
  "libplacebo360",
  "libass9",
  "libvulkan1",
]
[deb.files]
"target/embedded-mpv/lib/jellypilot/libmpv.so" = "usr/lib/jellypilot/libmpv.so"
"target/embedded-mpv/share/jellypilot/mpv-baseline.conf" = "usr/share/jellypilot/mpv-baseline.conf"

[appimage.files]
"target/embedded-mpv/lib/jellypilot/libmpv.so" = "usr/lib/jellypilot/libmpv.so"
"target/embedded-mpv/share/jellypilot/mpv-baseline.conf" = "usr/share/jellypilot/mpv-baseline.conf"

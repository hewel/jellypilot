[package]
name = "jellypilot-iced"
description = "Cross-platform iced frontend for JellyPilot"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
debug = ["iced/hot"]
dev = ["iced/hot"]

[dependencies]
jellypilot-auth = { path = "../crates/jellypilot-auth" }
jellypilot-core = { path = "../crates/jellypilot-core" }
jellypilot-media-server = { path = "../crates/jellypilot-media-server" }
jellypilot-mpv = { path = "../crates/jellypilot-mpv" }
jellypilot-session = { path = "../crates/jellypilot-session" }
jellypilot-ui = { path = "../crates/jellypilot-ui" }
iced = { workspace = true }
fluent-templates = "0.15.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sys-locale = "0.3"
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt", "sync", "time"] }
interprocess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.23.1", default-features = false }
url = "2.5.8"
zeroize = "1.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
jellypilot-mpv-host = { path = "../crates/jellypilot-mpv-host" }
iced_wgpu = { workspace = true }

[dev-dependencies]
fluent-syntax = "0.12"
iced_runtime = { workspace = true }
jellypilot-media-server = { path = "../crates/jellypilot-media-server", features = ["test-utils"] }
jellypilot-core = { path = "../crates/jellypilot-core", features = ["test-utils"] }

[lints]
workspace = true

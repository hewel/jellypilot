[package]
name = "jellypilot-iced"
description = "Cross-platform iced frontend for JellyPilot"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
debug = ["iced/hot"]
dev = ["iced/hot"]

[dependencies]
jellypilot-auth = { path = "../crates/jellypilot-auth" }
jellypilot-core = { path = "../crates/jellypilot-core" }
jellypilot-media-server = { path = "../crates/jellypilot-media-server" }
jellypilot-mpv = { path = "../crates/jellypilot-mpv" }
jellypilot-session = { path = "../crates/jellypilot-session" }
jellypilot-ui = { path = "../crates/jellypilot-ui" }
iced = { workspace = true }
fluent-templates = "0.15.1"
chrono = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sys-locale = "0.3"
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt", "sync", "time"] }
interprocess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.23.1", default-features = false }
url = "2.5.8"
zeroize = "1.8.1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
dirs = "6.0.0"
jellypilot-mpv-host = { path = "../crates/jellypilot-mpv-host" }
iced_wgpu = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[dev-dependencies]
fluent-syntax = "0.12"
iced_runtime = { workspace = true }
jellypilot-media-server = { path = "../crates/jellypilot-media-server", features = ["test-utils"] }
jellypilot-core = { path = "../crates/jellypilot-core", features = ["test-utils"] }
tokio-tungstenite = "0.29.0"

[lints]
workspace = true

[workspace]
# Desktop workspace: the iced frontend plus its display/Vulkan-only crates.
# Shared domain crates stay in the root workspace; members outside this
# directory declare `package.workspace = "../../src-iced"` explicitly.
members = [
  "../crates/jellypilot-ui",
  "../crates/jellypilot-mpv-host",
  "../crates/jellypilot-launcher",
]
resolver = "2"

[workspace.dependencies]
# Exact published fork revision: tools/embedded-mpv/iced-source.json.
# The dispatcher materializes this repository-relative tree before invoking Cargo.
iced = { path = "../target/vendor/iced", features = ["advanced", "advanced-shaping", "image", "svg", "tokio"] }
iced_runtime = { path = "../target/vendor/iced/runtime" }
iced_wgpu = { path = "../target/vendor/iced/wgpu" }

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/hewel/jellypilot"
rust-version = "1.98"
version = "2.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

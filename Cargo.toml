[workspace]
members = [
  "crates/jellypilot-core",
  "crates/jellypilot-auth",
  "crates/jellypilot-ui",
  "crates/jellypilot-media-server",
  "crates/jellypilot-mpv",
  "crates/jellypilot-mpv-host",
  "crates/jellypilot-session",
  "crates/jellypilot-launcher",
  "src-iced",
]
exclude = [
  "crates/media-server-api/emby",
  "crates/media-server-api/jellyfin",
  "experiments/iced-local-video",
  "crates/jellypilot-player",
  "target/vendor/iced",
]
resolver = "2"

[workspace.dependencies]
# Exact published fork revision: tools/embedded-mpv/iced-source.json.
# The dispatcher materializes this repository-relative tree before invoking Cargo.
iced = { path = "target/vendor/iced", features = ["advanced", "advanced-shaping", "image", "svg", "tokio"] }
iced_runtime = { path = "target/vendor/iced/runtime" }
iced_wgpu = { path = "target/vendor/iced/wgpu" }

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/hewel/jellypilot"
rust-version = "1.98"
version = "2.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

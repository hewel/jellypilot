[workspace]
# Display-free shared workspace: domain crates plus the SDK/FFI surface consumed
# by both the iced desktop frontend and the Android client. Desktop packages
# (jellypilot-ui, jellypilot-mpv-host, jellypilot-launcher, jellypilot-iced)
# live in the separate workspace rooted at src-iced/Cargo.toml and are excluded
# here so shared/Android builds never resolve the pinned iced vendor tree.
members = [
  "crates/jellypilot-core",
  "crates/jellypilot-auth",
  "crates/jellypilot-media-server",
  "crates/jellypilot-mpv",
  "crates/jellypilot-session",
  "crates/jellypilot-sdk",
  "crates/jellypilot-ffi",
]
exclude = [
  "crates/jellypilot-ui",
  "crates/jellypilot-mpv-host",
  "crates/jellypilot-launcher",
  "src-iced",
  "crates/media-server-api/emby",
  "crates/media-server-api/jellyfin",
  "target/vendor/iced",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/hewel/jellypilot"
rust-version = "1.98"
version = "2.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

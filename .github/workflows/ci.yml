name: CI Checks
on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and Lint check
        run: bun run check

      - name: Run tests
        run: bun run test:all

      - name: Production build
        run: bun run build

  compile-backend:
    name: Compile backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
      # Production feature set = default features (SQLite catalog + image/ravif
      # codec). Deliberately not --all-features so the dav1d benchmark decoder
      # and the webdriver harness stay out of the production compile gate.
      - name: Compile Tauri backend (production SQLite + codec)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

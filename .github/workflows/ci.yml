name: CI Checks
on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev wayland-protocols libgl1-mesa-dri mesa-vulkan-drivers xauth xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint, typecheck, and clippy
        run: bun run check

      - name: Run Rust tests
        run: bun run task rust test

      - name: Run iced startup smoke
        run: xvfb-run -a bun run task iced run --smoke

  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
      - name: Compile workspace
        run: cargo check --locked --workspace

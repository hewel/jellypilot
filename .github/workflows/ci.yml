name: CI Checks
on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev libayatana-appindicator3-dev librsvg2-dev xauth xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned WASM toolchain
        run: bun run wasm:install

      - name: Format and Lint check
        run: bun run check

      - name: Run tests
        run: bun run test:all

      - name: Run GTK startup smoke
        run: xvfb-run -a env GSK_RENDERER=cairo bun run gtk:smoke

      - name: Production build
        run: bun run build

  compile-backend:
    name: Compile backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
      # Production feature set = default features (SQLite Library Image Cache).
      # Deliberately not --all-features so the webdriver harness stays out of
      # the production compile gate.
      - name: Compile Tauri backend (production SQLite cache)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

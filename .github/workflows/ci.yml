name: CI Checks
on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md", ".gitignore"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev wayland-protocols libgl1-mesa-dri mesa-vulkan-drivers xauth xvfb
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
      - name: Discard cached iced vendor
        shell: bash
        run: rm -rf target/vendor/iced target/vendor/iced-*
      - name: Check Rust formatting, clippy, and xtask tests
        run: cargo xtask check

      - name: Run Rust tests
        run: cargo xtask test

      - name: Run iced startup smoke
        run: xvfb-run -a cargo xtask iced run --smoke

name: Cross-platform Compile
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/compile.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - "src-iced/**"
      - "crates/**"
      - "assets/icons/**"
      - "scripts/**"
      - "tools/embedded-mpv/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/compile.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - "src-iced/**"
      - "crates/**"
      - "assets/icons/**"
      - "scripts/**"
      - "tools/embedded-mpv/**"

jobs:
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
      - name: Discard cached iced vendor
        shell: bash
        run: rm -rf target/vendor/iced target/vendor/iced-*
      - name: Compile workspace
        run: bun run task rust check

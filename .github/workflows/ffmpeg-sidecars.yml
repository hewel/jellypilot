name: Build FFmpeg Sidecars

on:
  workflow_dispatch:
  push:
    tags:
      - 'ffmpeg-n9.0-linux-x86_64-r*'

permissions:
  contents: read

concurrency:
  group: ffmpeg-sidecars-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_TAG: n9.0
  FFMPEG_TAG_COMMIT: d32b387f2b0a484599d4587d651891f0c63c4238
  FFMPEG_TAG_SIGNING_KEY: DD1EC9E8DE085C629B3E1846B18E8928B3948D64
  FFMPEG_RELEASE_SIGNING_KEY: FCF986EA15E6E293A5644F10B4322F04D67658D8
  BTBN_COMMIT: 2437e7b868da3c11872367b15f3c613b87c24819
  BTBN_TREE: 9484782a760055d99e8c2b2a4ebbf2e9ead596e6

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 GPL pair
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg jq xz-utils

      - name: Verify the signed FFmpeg release and tag
        run: |
          curl --fail --location --silent --show-error \
            --output ffmpeg-devel.asc https://ffmpeg.org/ffmpeg-devel.asc
          curl --fail --location --silent --show-error \
            --output ffmpeg-9.0.tar.xz https://ffmpeg.org/releases/ffmpeg-9.0.tar.xz
          curl --fail --location --silent --show-error \
            --output ffmpeg-9.0.tar.xz.asc https://ffmpeg.org/releases/ffmpeg-9.0.tar.xz.asc
          gpg --batch --import ffmpeg-devel.asc
          gpg --batch --with-colons --fingerprint "$FFMPEG_RELEASE_SIGNING_KEY" \
            | grep -F "fpr:::::::::$FFMPEG_RELEASE_SIGNING_KEY:"
          gpg --batch --verify ffmpeg-9.0.tar.xz.asc ffmpeg-9.0.tar.xz

          gpg --batch --keyserver hkps://keys.openpgp.org \
            --recv-keys "$FFMPEG_TAG_SIGNING_KEY"
          gpg --batch --with-colons --fingerprint "$FFMPEG_TAG_SIGNING_KEY" \
            | grep -F "fpr:::::::::$FFMPEG_TAG_SIGNING_KEY:"
          git clone --filter=blob:none --no-checkout \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg-source
          git -C ffmpeg-source fetch --depth=1 origin "refs/tags/$FFMPEG_TAG:refs/tags/$FFMPEG_TAG"
          git -C ffmpeg-source verify-tag "$FFMPEG_TAG"
          resolved_commit="$(git -C ffmpeg-source rev-list -n 1 "$FFMPEG_TAG")"
          test "$resolved_commit" = "$FFMPEG_TAG_COMMIT"

      - name: Check out the pinned BtbN build system
        run: |
          git init btbn-build
          git -C btbn-build remote add origin https://github.com/BtbN/FFmpeg-Builds.git
          git -C btbn-build fetch --depth=1 origin "$BTBN_COMMIT"
          git -C btbn-build checkout --detach FETCH_HEAD
          test "$(git -C btbn-build rev-parse HEAD)" = "$BTBN_COMMIT"
          test "$(git -C btbn-build rev-parse 'HEAD^{tree}')" = "$BTBN_TREE"

      - name: Build the pinned GPL toolchain
        working-directory: btbn-build
        env:
          GIT_BRANCH_OVERRIDE: n9.0
          FFMPEG_TAG_COMMIT: ${{ env.FFMPEG_TAG_COMMIT }}
        run: |
          sed -i \
            '/^docker run --rm -i .* bash \/build.sh$/a test "$(git -C ffbuild/ffmpeg rev-parse HEAD)" = "$FFMPEG_TAG_COMMIT"' \
            build.sh
          grep -F 'test "$(git -C ffbuild/ffmpeg rev-parse HEAD)" = "$FFMPEG_TAG_COMMIT"' \
            build.sh
          ./makeimage.sh linux64 gpl 9.0
          ./build.sh linux64 gpl 9.0

      - name: Extract paired executables and notices
        run: |
          archive="$(find btbn-build/artifacts -maxdepth 1 -name 'ffmpeg-*-linux64-gpl-9.0.tar.xz' -print -quit)"
          test -n "$archive"
          mkdir -p ffmpeg-unpacked release-assets
          tar -xJf "$archive" -C ffmpeg-unpacked
          ffmpeg_path="$(find ffmpeg-unpacked -type f -path '*/bin/ffmpeg' -print -quit)"
          ffprobe_path="$(find ffmpeg-unpacked -type f -path '*/bin/ffprobe' -print -quit)"
          license_path="$(find ffmpeg-unpacked -type f -name LICENSE.txt -print -quit)"
          test -n "$ffmpeg_path"
          test -n "$ffprobe_path"
          test -n "$license_path"
          install -m755 "$ffmpeg_path" release-assets/ffmpeg-linux-x64
          install -m755 "$ffprobe_path" release-assets/ffprobe-linux-x64
          install -m644 "$license_path" release-assets/linux-x64.LICENSE

      - name: Verify version, configuration, encoders, probe, and HLS
        run: |
          ffmpeg="$PWD/release-assets/ffmpeg-linux-x64"
          ffprobe="$PWD/release-assets/ffprobe-linux-x64"
          "$ffmpeg" -version | tee ffmpeg-version.txt
          "$ffprobe" -version | tee ffprobe-version.txt
          grep -Eq '^ffmpeg version (n)?9\.0([ -]|$)' ffmpeg-version.txt
          grep -Eq '^ffprobe version (n)?9\.0([ -]|$)' ffprobe-version.txt

          "$ffmpeg" -hide_banner -buildconf 2>&1 | tee build-configuration.txt
          grep -F -- '--enable-gpl' build-configuration.txt
          grep -F -- '--enable-version3' build-configuration.txt
          grep -F -- '--enable-libdrm' build-configuration.txt
          grep -F -- '--enable-vaapi' build-configuration.txt
          grep -F -- '--enable-libx264' build-configuration.txt
          grep -F -- '--enable-libx265' build-configuration.txt
          if grep -F -- '--enable-nonfree' build-configuration.txt; then
            echo '::error::Refusing to redistribute a nonfree FFmpeg build.'
            exit 1
          fi

          "$ffmpeg" -hide_banner -encoders 2>&1 | tee encoders.txt
          grep -E '(^| )libx264( |$)' encoders.txt
          grep -E '(^| )libx265( |$)' encoders.txt
          grep -E '(^| )h264_vaapi( |$)' encoders.txt
          grep -E '(^| )hevc_vaapi( |$)' encoders.txt
          "$ffmpeg" -hide_banner -hwaccels 2>&1 | tee hardware-accelerators.txt
          grep -Fx 'vaapi' hardware-accelerators.txt

          mkdir -p smoke/hls
          "$ffmpeg" -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=128x72:rate=24 \
            -f lavfi -i sine=frequency=1000:sample_rate=48000 \
            -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            -y smoke/h264.mkv
          "$ffmpeg" -nostdin -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=128x72:rate=24:duration=1 \
            -c:v libx265 -pix_fmt yuv420p -y smoke/hevc.mkv
          "$ffprobe" -v error -show_streams -show_format -of json \
            smoke/h264.mkv | tee probe-h264.json
          "$ffprobe" -v error -show_streams -show_format -of json \
            smoke/hevc.mkv | tee probe-hevc.json
          jq -e '.streams | any(.codec_type == "video" and .codec_name == "h264")' \
            probe-h264.json
          jq -e '.streams | any(.codec_type == "audio")' probe-h264.json
          jq -e '.streams | any(.codec_type == "video" and .codec_name == "hevc")' \
            probe-hevc.json

          "$ffmpeg" -nostdin -hide_banner -loglevel error -i smoke/h264.mkv \
            -c:v libx264 -pix_fmt yuv420p -c:a aac \
            -f hls -hls_segment_type fmp4 -hls_time 1 -hls_list_size 0 \
            -y smoke/hls/stream.m3u8
          test -s smoke/hls/stream.m3u8
          test -s smoke/hls/init.mp4
          test -n "$(find smoke/hls -name '*.m4s' -print -quit)"

      - name: Write build provenance and checksums
        run: |
          {
            printf '%s\n' '# JellyPilot FFmpeg/FFprobe Linux x86_64 build'
            printf '\nFFmpeg tag: `%s`\n' "$FFMPEG_TAG"
            printf 'FFmpeg commit: `%s`\n' "$FFMPEG_TAG_COMMIT"
            printf 'BtbN FFmpeg-Builds commit: `%s`\n' "$BTBN_COMMIT"
            printf 'Workflow source: `%s@%s`\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'Workflow run: `%s/actions/runs/%s`\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '%s\n' '## FFmpeg version and build configuration' '```text'
            cat ffmpeg-version.txt build-configuration.txt
            printf '%s\n' '```' '' '## FFprobe version' '```text'
            cat ffprobe-version.txt
            printf '%s\n' '```'
          } > release-assets/linux-x64.README

          ffmpeg_sha="$(sha256sum release-assets/ffmpeg-linux-x64 | cut -d' ' -f1)"
          ffprobe_sha="$(sha256sum release-assets/ffprobe-linux-x64 | cut -d' ' -f1)"
          jq -n \
            --arg ffmpegTag "$FFMPEG_TAG" \
            --arg ffmpegCommit "$FFMPEG_TAG_COMMIT" \
            --arg ffmpegTagSigningKey "$FFMPEG_TAG_SIGNING_KEY" \
            --arg btbnCommit "$BTBN_COMMIT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflowCommit "$GITHUB_SHA" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg ffmpegSha256 "$ffmpeg_sha" \
            --arg ffprobeSha256 "$ffprobe_sha" \
            '{
              schemaVersion: 1,
              target: "x86_64-unknown-linux-gnu",
              licenseVariant: "gpl",
              ffmpeg: {
                tag: $ffmpegTag,
                commit: $ffmpegCommit,
                tagSigningKey: $ffmpegTagSigningKey,
                sha256: $ffmpegSha256
              },
              ffprobe: { sha256: $ffprobeSha256 },
              buildSystem: { repository: "BtbN/FFmpeg-Builds", commit: $btbnCommit },
              workflow: {
                repository: $repository,
                commit: $workflowCommit,
                run: $workflowRun
              },
              requiredFeatures: ["vaapi", "libdrm", "libx264", "libx265"]
            }' > release-assets/PROVENANCE.json
          (cd release-assets && sha256sum * > SHA256SUMS)
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-n9.0-linux-x86_64
          path: release-assets/
          if-no-files-found: error

      - name: Confirm immutable releases are enabled
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')"
          if [ "$enabled" != true ]; then
            echo '::error::Enable GitHub immutable releases before publishing sidecar assets.'
            exit 1
          fi

      - name: Publish immutable sidecar release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$(mktemp)"
          {
            echo 'JellyPilot-owned FFmpeg 9.0 and FFprobe Linux x86_64 sidecars.'
            echo
            echo 'The attached SHA256SUMS and PROVENANCE.json record the verified inputs.'
          } > "$notes_file"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "FFmpeg 9.0 Linux x86_64 sidecars" --notes-file "$notes_file"
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false

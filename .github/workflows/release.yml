name: Native Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# The LAN jobs share a workspace and persistent build caches across runs.
concurrency:
  group: native-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      tag: ${{ steps.versions.outputs.tag }}
      release_notes: ${{ steps.versions.outputs.release_notes }}
      test_suffix: ${{ steps.versions.outputs.test_suffix }}
      build_info: ${{ steps.versions.outputs.build_info }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate versions and release notes
        id: versions
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          cargo = tomllib.loads(Path('Cargo.toml').read_text())
          packager = tomllib.loads(Path('Packager.toml').read_text())
          pkgbuild = Path('packaging/arch/PKGBUILD').read_text()
          bin_pkgbuild = Path('packaging/arch/bin/PKGBUILD').read_text()
          pkgver_match = re.search(r'^pkgver=([^\s#]+)', pkgbuild, re.MULTILINE)
          bin_pkgver_match = re.search(r'^pkgver=([^\s#]+)', bin_pkgbuild, re.MULTILINE)
          if pkgver_match is None:
              raise SystemExit('packaging/arch/PKGBUILD does not declare pkgver')
          if bin_pkgver_match is None:
              raise SystemExit('packaging/arch/bin/PKGBUILD does not declare pkgver')
          versions = {
              'Cargo workspace': cargo['workspace']['package']['version'],
              'Packager.toml': packager['version'],
              'PKGBUILD': pkgver_match.group(1).strip("'\""),
              'bin PKGBUILD': bin_pkgver_match.group(1).strip("'\""),
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f'Release versions disagree: {json.dumps(versions, sort_keys=True)}')
          version = packager['version']
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) is None:
              raise SystemExit(f'Package version must be stable MAJOR.MINOR.PATCH, got {version!r}')
          tag = f'v{version}'
          notes_path = ''
          if os.environ['EVENT_NAME'] == 'push':
              notes_path = Path('.github/release-notes') / f'{tag}.md'
              if not notes_path.is_file():
                  raise SystemExit(f'Missing checked-in release notes: {notes_path}')
              expected_heading = f'## {tag}'
              actual_heading = notes_path.read_text().splitlines()[0]
              if actual_heading != expected_heading:
                  raise SystemExit(f'{notes_path} must start with {expected_heading!r}, got {actual_heading!r}')
              if os.environ['REF_TYPE'] == 'tag':
                  ref_name = os.environ['REF_NAME']
                  if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', ref_name) is None:
                      raise SystemExit(f'Release tag must be stable vMAJOR.MINOR.PATCH, got {ref_name!r}')
                  if ref_name != tag:
                      raise SystemExit(f'Release tag {ref_name!r} does not match metadata tag {tag!r}')
          sha = os.environ['GITHUB_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          test_suffix = f'-test-{sha[:12]}-{run_id}-{attempt}'
          build_info = {
              'build_kind': 'test' if os.environ['EVENT_NAME'] == 'workflow_dispatch' else 'release',
              'version': version,
              'commit': sha,
              'ref': os.environ['GITHUB_REF'],
              'run_id': run_id,
              'run_attempt': attempt,
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              'workflow': os.environ['GITHUB_WORKFLOW'],
          }
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
              output.write(f'tag={tag}\n')
              output.write(f'release_notes={notes_path}\n')
              output.write(f'test_suffix={test_suffix}\n')
              output.write(f'build_info={json.dumps(build_info, separators=(",", ":"))}\n')
          PY

  package:
    name: Package ${{ matrix.platform }} (${{ matrix.format }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            format: nsis
            asset: '*.exe'
          - os: macos-latest
            platform: macos
            format: dmg
            asset: '*.dmg'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
      - name: Discard cached iced vendor
        shell: bash
        run: rm -rf target/vendor/iced target/vendor/iced-*
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - name: Set up Windows MPV build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-luajit
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
      - name: Build pinned Windows MPV
        if: runner.os == 'Windows'
        id: windows-mpv
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cargo xtask mpv build
          echo "runtime-dir=$(cygpath -w "$MINGW_PREFIX/bin")" >> "$GITHUB_OUTPUT"
      - name: Package Windows with embedded runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo xtask package windows --runtime-dir '${{ steps.windows-mpv.outputs.runtime-dir }}'
      - name: Build ${{ matrix.format }} package
        if: runner.os != 'Windows'
        run: cargo packager --config Packager.toml --formats ${{ matrix.format }}
      - name: Verify installed Windows embedded payload
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem target/release/bundle/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'jellypilot-install-check'
          $installer = Start-Process $installers[0].FullName -ArgumentList "/S /NS /D=$destination" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          ./packaging/windows/verify-package.ps1 -Root $destination -ExpectedExecutable target/release/jellypilot.exe |
            Tee-Object -FilePath target/windows-package-verification.json
      - name: Upload ${{ matrix.format }} package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-${{ matrix.platform }}-${{ matrix.format }}
          path: target/release/bundle/${{ matrix.asset }}
          if-no-files-found: error
      - name: Archive standalone diagnostics with required runtime
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          release = Path('target/release')
          name = f"jellypilot-{os.environ['PLATFORM']}-diagnostics"
          if os.environ['RUNNER_OS'] == 'Windows':
              # The installer verification checked this helper against target/release.
              # Keep adjacent launcher runtime DLLs, not the embedded MPV DLL tree.
              installed = Path(os.environ['RUNNER_TEMP']) / 'jellypilot-install-check'
              helper = installed / 'jellypilot-diagnostics.exe'
              with zipfile.ZipFile(release / f'{name}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in [helper, *sorted(installed.glob('*.dll'))]:
                      archive.write(path, path.name)
          else:
              with tarfile.open(release / f'{name}.tar.gz', 'w:gz') as archive:
                  archive.add(release / 'jellypilot-diagnostics', arcname='jellypilot-diagnostics')
          PY
      - name: Upload release diagnostics
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-${{ matrix.platform }}-diagnostics
          path: target/release/jellypilot-${{ matrix.platform }}-diagnostics.*
          if-no-files-found: error
      - name: Assemble identifiable test package
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BUILD_INFO: ${{ needs.metadata.outputs.build_info }}
          PLATFORM: ${{ matrix.platform }}
          PACKAGE_GLOB: ${{ matrix.asset }}
          TEST_SUFFIX: ${{ needs.metadata.outputs.test_suffix }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile

          destination = Path('target/test-package')
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True, exist_ok=True)
          packages = sorted(Path('target/release/bundle').glob(os.environ['PACKAGE_GLOB']))
          if not packages:
              raise SystemExit('No test installer found')
          files = packages + sorted(Path('target/release').glob(f"jellypilot-{os.environ['PLATFORM']}-diagnostics.*"))
          if len(files) == len(packages):
              raise SystemExit('No standalone diagnostics archive found')
          for path in files:
              shutil.copy2(path, destination / path.name)
          info = json.loads(os.environ['BUILD_INFO'])
          info.update(platform=os.environ['PLATFORM'], runner_arch=os.environ['RUNNER_ARCH'])
          (destination / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          with (destination / 'SHA256SUMS').open('w') as checksums:
              for path in sorted(destination.iterdir()):
                  if path.name != 'SHA256SUMS':
                      with path.open('rb') as content:
                          digest = hashlib.file_digest(content, 'sha256').hexdigest()
                      checksums.write(f'{digest}  {path.name}\n')
          # Tar preserves Unix executable modes, unlike artifact ZIP downloads.
          archive_name = f"jellypilot-{os.environ['PLATFORM']}{os.environ['TEST_SUFFIX']}.tar.gz"
          with tarfile.open(Path('target') / archive_name, 'w:gz') as archive:
              for path in sorted(destination.iterdir()):
                  archive.add(path, arcname=path.name)
          PY
      - name: Upload test package and diagnostics
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-${{ matrix.platform }}-${{ matrix.format }}${{ needs.metadata.outputs.test_suffix }}
          path: target/jellypilot-${{ matrix.platform }}${{ needs.metadata.outputs.test_suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Package linux-x86_64 (deb, appimage)
    needs: metadata
    # Fedora LAN runner. Build inside Ubuntu 26.04 for an Ubuntu LTS glibc
    # instead of Fedora 44. The pinned private runtime supplies libplacebo
    # 7.387.0 because Ubuntu does not publish that version.
    runs-on: jellypilot-lan
    concurrency:
      group: jellypilot-lan-packaging
      cancel-in-progress: false
    steps:
      - name: Restore leftover workspace ownership
        run: |
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            # Rootless podman maps host user to namespace uid 0, not $(id -u).
            podman unshare chown -R 0:0 "${GITHUB_WORKSPACE}"
            rm -rf "${GITHUB_WORKSPACE}/.codegraph"
          fi
      - uses: actions/checkout@v4
      - name: Build Debian and AppImage packages
        run: |
          cache="${HOME}/.cache/jellypilot-ci"
          tools="${cache}/packager/AppImage"
          mkdir -p "${cache}/cargo" "${cache}/rustup" "${tools}"
          download() {
            local dest="$1" url="$2"
            if [[ -s "${dest}" ]]; then
              return
            fi
            curl --retry 8 --retry-all-errors --retry-delay 2 -fL --connect-timeout 20 \
              -o "${dest}.part" "${url}"
            chmod 764 "${dest}.part"
            mv "${dest}.part" "${dest}"
          }
          download "${tools}/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          download "${tools}/linuxdeploy-x86_64.AppImage" \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          download "${tools}/linuxdeploy-plugin-appimage.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          podman run --rm \
            --security-opt label=disable \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${cache}/cargo:/opt/cargo" \
            -v "${cache}/rustup:/opt/rustup" \
            -v "${cache}/packager:/root/.cache/.cargo-packager" \
            -w /work \
            -e CARGO_HOME=/opt/cargo \
            -e RUSTUP_HOME=/opt/rustup \
            -e XDG_CACHE_HOME=/root/.cache \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            docker.io/library/ubuntu:26.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              export PATH="/opt/cargo/bin:$PATH"
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential pkg-config git unzip xz-utils \
                meson ninja-build python3 binutils patchelf \
                libgtk-3-dev libxkbcommon-dev libwayland-dev wayland-protocols \
                libfuse2t64 file \
                libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
                libswresample-dev libswscale-dev libass-dev libluajit-5.1-dev \
                libvulkan-dev glslang-dev libshaderc-dev liblcms2-dev
              if ! command -v rustc >/dev/null; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
                  -y --default-toolchain 1.100.0 --profile minimal --no-modify-path
              fi
              if ! command -v cargo-packager >/dev/null; then
                cargo install cargo-packager --version 0.11.8 --locked
              fi
              cargo xtask mpv linux-runtime
              cargo packager --config Packager.toml --formats deb
              cargo packager --config Packager.toml --formats appimage
            '
      - name: Upload deb package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-deb
          path: target/release/bundle/*.deb
          if-no-files-found: error
      - name: Upload AppImage package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-appimage
          path: target/release/bundle/*.AppImage
          if-no-files-found: error
      - name: Archive standalone Linux diagnostics
        run: |
          tar -czf target/release/jellypilot-linux-x86_64-diagnostics.tar.gz \
            -C target/release jellypilot-diagnostics
      - name: Upload release diagnostics
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-diagnostics
          path: target/release/jellypilot-linux-x86_64-diagnostics.tar.gz
          if-no-files-found: error
      - name: Assemble identifiable Linux test packages
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILD_INFO: ${{ needs.metadata.outputs.build_info }}
          TEST_SUFFIX: ${{ needs.metadata.outputs.test_suffix }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile

          destination = Path('target/test-package')
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True, exist_ok=True)
          bundle = Path('target/release/bundle')
          files = [Path('target/release/jellypilot-linux-x86_64-diagnostics.tar.gz')]
          for pattern in ('*.deb', '*.AppImage'):
              packages = sorted(bundle.glob(pattern))
              if not packages:
                  raise SystemExit(f'No test installer found: {pattern}')
              files.extend(packages)
          for path in files:
              shutil.copy2(path, destination / path.name)
          info = json.loads(os.environ['BUILD_INFO'])
          info.update(platform='linux-x86_64', runner_arch=os.environ['RUNNER_ARCH'], build_image='ubuntu:26.04')
          (destination / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          with (destination / 'SHA256SUMS').open('w') as checksums:
              for path in sorted(destination.iterdir()):
                  if path.name != 'SHA256SUMS':
                      with path.open('rb') as content:
                          digest = hashlib.file_digest(content, 'sha256').hexdigest()
                      checksums.write(f'{digest}  {path.name}\n')
          # Preserve AppImage and diagnostics executable modes in downloads.
          archive_name = f"jellypilot-linux-x86_64{os.environ['TEST_SUFFIX']}.tar.gz"
          with tarfile.open(Path('target') / archive_name, 'w:gz') as archive:
              for path in sorted(destination.iterdir()):
                  archive.add(path, arcname=path.name)
          PY
      - name: Upload Linux test packages and diagnostics
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-deb-appimage${{ needs.metadata.outputs.test_suffix }}
          path: target/jellypilot-linux-x86_64${{ needs.metadata.outputs.test_suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Restore workspace ownership
        if: always()
        run: podman unshare chown -R 0:0 "${GITHUB_WORKSPACE}"

  arch:
    name: Package Arch Linux
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: metadata
    # Fedora LAN runner (10.0.0.28). Builds with rootless podman because
    # the host is not Arch and has no Docker CLI for job containers.
    runs-on: jellypilot-lan
    concurrency:
      group: jellypilot-lan-packaging
      cancel-in-progress: false
    steps:
      - name: Restore leftover workspace ownership
        run: |
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            # Rootless podman maps host user to namespace uid 0, not $(id -u).
            podman unshare chown -R 0:0 "${GITHUB_WORKSPACE}"
            rm -rf "${GITHUB_WORKSPACE}/.codegraph"
          fi
      - uses: actions/checkout@v4
      - name: Validate PKGBUILD tag
        run: |
          pkgver="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          test "v${pkgver}" = "${GITHUB_REF_NAME}" || {
            printf 'PKGBUILD pkgver %s does not match tag %s\n' "${pkgver}" "${GITHUB_REF_NAME}" >&2
            exit 1
          }
      - name: Build native Arch package
        run: |
          mkdir -p target/release/bundle
          podman run --rm \
            --security-opt label=disable \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            docker.io/library/archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed git curl rust gtk3 mpv libxkbcommon wayland \
                meson ninja pkgconf binutils patchelf vulkan-headers vulkan-icd-loader ffmpeg \
                glslang libass shaderc lcms2 luajit
              useradd --create-home builder
              mkdir -p /work/target/release/bundle
              chown -R builder:builder /work
              runuser -u builder -- env RUSTUP_INIT_SKIP_PATH_CHECK=yes bash -c "
                set -euo pipefail
                curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
                  -y --default-toolchain 1.100.0 --profile minimal --no-modify-path
                export PATH=\"\$HOME/.cargo/bin:\$PATH\"
                cd \"\$1\"
                PKGDEST=\"\$2\" makepkg --noconfirm --cleanbuild
              " _ /work/packaging/arch /work/target/release/bundle
              chown -R root:root /work/target/release/bundle
            '
      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-arch
          path: target/release/bundle/jellypilot-[0-9]*.pkg.tar.zst
          if-no-files-found: error
      - name: Upload optional Arch debug package
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-arch-debug
          path: target/release/bundle/jellypilot-debug-*.pkg.tar.zst
          if-no-files-found: ignore
      - name: Restore workspace ownership
        if: always()
        run: podman unshare chown -R 0:0 "${GITHUB_WORKSPACE}"

  release:
    name: Create draft GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, package, arch, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: jellypilot-*
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: JellyPilot ${{ needs.metadata.outputs.version }}
          body_path: ${{ needs.metadata.outputs.release_notes }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*

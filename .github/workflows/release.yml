name: Native Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      tag: ${{ steps.versions.outputs.tag }}
      release_notes: ${{ steps.versions.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate versions and release notes
        id: versions
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          cargo = tomllib.loads(Path('Cargo.toml').read_text())
          package = json.loads(Path('package.json').read_text())
          packager = tomllib.loads(Path('Packager.toml').read_text())
          pkgbuild = Path('packaging/arch/PKGBUILD').read_text()
          bin_pkgbuild = Path('packaging/arch/bin/PKGBUILD').read_text()
          pkgver_match = re.search(r'^pkgver=([^\s#]+)', pkgbuild, re.MULTILINE)
          bin_pkgver_match = re.search(r'^pkgver=([^\s#]+)', bin_pkgbuild, re.MULTILINE)
          if pkgver_match is None:
              raise SystemExit('packaging/arch/PKGBUILD does not declare pkgver')
          if bin_pkgver_match is None:
              raise SystemExit('packaging/arch/bin/PKGBUILD does not declare pkgver')
          versions = {
              'Cargo workspace': cargo['workspace']['package']['version'],
              'package.json': package['version'],
              'Packager.toml': packager['version'],
              'PKGBUILD': pkgver_match.group(1).strip("'\""),
              'bin PKGBUILD': bin_pkgver_match.group(1).strip("'\""),
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f'Release versions disagree: {json.dumps(versions, sort_keys=True)}')
          version = packager['version']
          tag = f'v{version}'
          notes_path = Path('.github/release-notes') / f'{tag}.md'
          if not notes_path.is_file():
              raise SystemExit(f'Missing checked-in release notes: {notes_path}')
          expected_heading = f'## {tag}'
          actual_heading = notes_path.read_text().splitlines()[0]
          if actual_heading != expected_heading:
              raise SystemExit(f'{notes_path} must start with {expected_heading!r}, got {actual_heading!r}')
          if os.environ['REF_TYPE'] == 'tag':
              ref_name = os.environ['REF_NAME']
              if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', ref_name) is None:
                  raise SystemExit(f'Release tag must be stable vMAJOR.MINOR.PATCH, got {ref_name!r}')
              if ref_name != tag:
                  raise SystemExit(f'Release tag {ref_name!r} does not match metadata tag {tag!r}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
              output.write(f'tag={tag}\n')
              output.write(f'release_notes={notes_path}\n')
          PY

  package:
    name: Package ${{ matrix.platform }} (${{ matrix.format }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            format: nsis
            asset: '*.exe'
          - os: macos-latest
            platform: macos
            format: dmg
            asset: '*.dmg'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'
      - name: Discard cached iced vendor
        shell: bash
        run: rm -rf target/vendor/iced target/vendor/iced-*
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - name: Build ${{ matrix.format }} package
        run: cargo packager --config Packager.toml --formats ${{ matrix.format }}
      - name: Upload ${{ matrix.format }} package
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-${{ matrix.platform }}-${{ matrix.format }}
          path: target/release/bundle/${{ matrix.asset }}
          if-no-files-found: error

  linux:
    name: Package linux-x86_64 (deb, appimage)
    needs: metadata
    # Fedora LAN runner. Build inside Ubuntu 26.04 so libplacebo 7.360
    # is available for the pinned mpv fork, with an Ubuntu LTS glibc
    # instead of Fedora 44.
    runs-on: jellypilot-lan
    steps:
      - name: Restore leftover workspace ownership
        run: |
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            # Rootless podman maps host user to namespace uid 0, not $(id -u).
            podman unshare chown -R 0:0 "${GITHUB_WORKSPACE}"
            rm -rf "${GITHUB_WORKSPACE}/.codegraph"
          fi
      - uses: actions/checkout@v4
      - name: Build Debian and AppImage packages
        run: |
          cache="${HOME}/.cache/jellypilot-ci"
          tools="${cache}/packager/AppImage"
          mkdir -p "${cache}/cargo" "${cache}/rustup" "${cache}/bun" "${tools}"
          download() {
            local dest="$1" url="$2"
            if [[ -s "${dest}" ]]; then
              return
            fi
            curl --retry 8 --retry-all-errors --retry-delay 2 -fL --connect-timeout 20 \
              -o "${dest}.part" "${url}"
            chmod 764 "${dest}.part"
            mv "${dest}.part" "${dest}"
          }
          download "${tools}/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          download "${tools}/linuxdeploy-x86_64.AppImage" \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          download "${tools}/linuxdeploy-plugin-appimage.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          podman run --rm \
            --security-opt label=disable \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${cache}/cargo:/opt/cargo" \
            -v "${cache}/rustup:/opt/rustup" \
            -v "${cache}/bun:/opt/bun" \
            -v "${cache}/packager:/root/.cache/.cargo-packager" \
            -w /work \
            -e CARGO_HOME=/opt/cargo \
            -e RUSTUP_HOME=/opt/rustup \
            -e BUN_INSTALL=/opt/bun \
            -e XDG_CACHE_HOME=/root/.cache \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -e HUSKY=0 \
            docker.io/library/ubuntu:26.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              export PATH="/opt/bun/bin:/opt/cargo/bin:$PATH"
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl build-essential pkg-config git unzip xz-utils \
                meson ninja-build python3 \
                libgtk-3-dev libxkbcommon-dev libwayland-dev wayland-protocols \
                libfuse2t64 file \
                libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
                libswresample-dev libswscale-dev libplacebo-dev libass-dev \
                libvulkan-dev glslang-dev libshaderc-dev liblcms2-dev
              # Ubuntu 26.04 ships libplacebo 7.360.0; pinned mpv meson wants 7.360.1.
              curl --retry 8 --retry-all-errors --retry-delay 2 -fL \
                -o /tmp/libplacebo360.deb \
                https://archive.ubuntu.com/ubuntu/pool/universe/libp/libplacebo/libplacebo360_7.360.1-1_amd64.deb
              curl --retry 8 --retry-all-errors --retry-delay 2 -fL \
                -o /tmp/libplacebo-dev.deb \
                https://archive.ubuntu.com/ubuntu/pool/universe/libp/libplacebo/libplacebo-dev_7.360.1-1_amd64.deb
              dpkg -i /tmp/libplacebo360.deb /tmp/libplacebo-dev.deb
              if ! command -v bun >/dev/null; then
                curl -fsSL https://bun.sh/install | bash
              fi
              if ! command -v rustc >/dev/null; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
                  -y --default-toolchain stable --profile minimal --no-modify-path
              fi
              if ! command -v cargo-packager >/dev/null; then
                cargo install cargo-packager --version 0.11.8 --locked
              fi
              bun install --frozen-lockfile
              bun run task mpv build
              cargo packager --config Packager.toml --formats deb
              cargo packager --config Packager.toml --formats appimage
            '
      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-deb
          path: target/release/bundle/*.deb
          if-no-files-found: error
      - name: Upload AppImage package
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-appimage
          path: target/release/bundle/*.AppImage
          if-no-files-found: error
      - name: Restore workspace ownership
        if: always()
        run: podman unshare chown -R 0:0 "${GITHUB_WORKSPACE}"

  arch:
    name: Package Arch Linux
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: metadata
    # Fedora LAN runner (10.0.0.28). Builds with rootless podman because
    # the host is not Arch and has no Docker CLI for job containers.
    runs-on: jellypilot-lan
    steps:
      - name: Restore leftover workspace ownership
        run: |
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            # Rootless podman maps host user to namespace uid 0, not $(id -u).
            podman unshare chown -R 0:0 "${GITHUB_WORKSPACE}"
            rm -rf "${GITHUB_WORKSPACE}/.codegraph"
          fi
      - uses: actions/checkout@v4
      - name: Validate PKGBUILD tag
        run: |
          pkgver="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          test "v${pkgver}" = "${GITHUB_REF_NAME}" || {
            printf 'PKGBUILD pkgver %s does not match tag %s\n' "${pkgver}" "${GITHUB_REF_NAME}" >&2
            exit 1
          }
      - name: Build native Arch package
        run: |
          mkdir -p target/release/bundle
          podman run --rm \
            --security-opt label=disable \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            docker.io/library/archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed git rust bun gtk3 mpv libxkbcommon wayland \
                meson ninja pkgconf vulkan-headers vulkan-icd-loader ffmpeg libplacebo libass \
                shaderc lcms2
              useradd --create-home builder
              mkdir -p /work/target/release/bundle
              chown -R builder:builder /work
              runuser -u builder -- bash -c "cd \"\$1\" && PKGDEST=\"\$2\" makepkg --noconfirm --cleanbuild" _ \
                /work/packaging/arch /work/target/release/bundle
              chown -R root:root /work/target/release/bundle
            '
      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-arch
          path: target/release/bundle/jellypilot-[0-9]*.pkg.tar.zst
          if-no-files-found: error
      - name: Upload optional Arch debug package
        uses: actions/upload-artifact@v4
        with:
          name: jellypilot-linux-x86_64-arch-debug
          path: target/release/bundle/jellypilot-debug-*.pkg.tar.zst
          if-no-files-found: ignore
      - name: Restore workspace ownership
        if: always()
        run: podman unshare chown -R 0:0 "${GITHUB_WORKSPACE}"

  release:
    name: Create draft GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, package, arch, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: JellyPilot ${{ needs.metadata.outputs.version }}
          body_path: ${{ needs.metadata.outputs.release_notes }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*

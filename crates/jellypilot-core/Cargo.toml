[package]
name = "jellypilot-core"
description = "Framework-independent state machines for JellyPilot"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dirs = { version = "6.0.0", optional = true }
icu_locale_core = { version = "2.2.0", features = ["alloc"] }
jellypilot-media-server = { path = "../jellypilot-media-server", optional = true, default-features = false }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }

[features]
default = ["native"]
portable = ["dep:jellypilot-media-server", "dep:serde", "dep:serde_json"]
native = ["portable", "dep:dirs", "jellypilot-media-server/native"]
test-utils = []

[lints]
workspace = true


[package]
name = "jellypilot-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]
members = ["../../experiments/iced-local-video"]
resolver = "2"

[dependencies]
iced = { git = "https://github.com/hewel/iced.git", rev = "f812ae504989444eb57d9f8669c1ab5a2e326c95", features = ["advanced", "advanced-shaping", "image", "svg", "tokio"] }
gstreamer = { version = "=0.25.2", features = ["v1_28"] }
gstreamer-app = { version = "=0.25.2", features = ["v1_28"] }
gstreamer-video = { version = "=0.25.2", features = ["v1_28"] }
# 0.25.3 base uses a macro absent from the pinned 0.25.2 core bindings.
gstreamer-base = "=0.25.2"
tokio = { version = "1.50.0", features = ["rt", "sync", "time", "net", "macros"] }
url = "2.5.8"
thiserror = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
base64 = "0.22"
getrandom = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"

iced_runtime = { git = "https://github.com/hewel/iced.git", rev = "f812ae504989444eb57d9f8669c1ab5a2e326c95" }
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

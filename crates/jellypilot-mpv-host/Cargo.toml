[package]
name = "jellypilot-mpv-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Intentionally not inheriting workspace unsafe_code=forbid: this crate is the
# audited Vulkan/libmpv boundary. lib.rs denies unsafe_op_in_unsafe_fn instead.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
iced_wgpu = { workspace = true, features = ["web-colors"] }
wgpu = { version = "29", features = ["vulkan"] }
ash = "0.38"
libloading = "0.8"
parking_lot = "0.12"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Idle inhibition wraps the host's real libwayland objects (winit pins
# wayland-backend's client_system backend) and uses a private X11 connection
# for XScreenSaverSuspend; both stay behind the safe IdleInhibit API.
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11rb = { version = "0.13", features = ["screensaver"] }

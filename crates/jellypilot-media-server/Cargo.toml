[package]
name = "jellypilot-media-server"
description = "Concrete Jellyfin and Emby HTTP client for JellyPilot"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true


[features]
test-utils = []
[dependencies]
base64 = "0.22.1"
bytes = "1.11.1"
dirs = "6.0.0"
emby_api = { version = "4.9.3", path = "../media-server-api/emby", features = ["rustls"] }
jellyfin_api = { version = "10.11.10", path = "../media-server-api/jellyfin", features = ["rustls"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
parking_lot = "0.12.5"
reqwest = { version = "0.13.3", features = ["json", "query", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync"] }
tracing = "0.1"
tungstenite = { version = "0.29.0", default-features = false }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
url = "2.5.8"
zeroize = "1.8.1"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }

[lints]
workspace = true

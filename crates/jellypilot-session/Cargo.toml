[package]
name = "jellypilot-session"
description = "Shared Jellyfin session protocol and Intro Skipper evaluation for JellyPilot"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
futures-util = "0.3.32"
jellypilot-media-server = { path = "../jellypilot-media-server" }
log = "0.4"
parking_lot = "0.12.5"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.18", features = ["rt"] }

[lints]
workspace = true
